name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
      - name: Release invariants
        run: pnpm check:release
      - name: Typecheck
        run: pnpm compile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Unit tests
        run: pnpm test
      - name: Third-party notices
        run: pnpm notices:check
      - name: Build
        run: pnpm build
      - name: Inspect artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm check:release
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Extension and fixture E2E
        run: pnpm e2e
